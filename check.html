<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="about.css">
    <link rel="stylesheet" href="check.css">
</head>
<body>
    <div class="check-container">
        <div class="header">
            <div class="logo-header">
                <img src="/IMG_E4385 (2).JPG" alt="">
            </div>
            <div class="search">
                <input type="search" name="" id="search" placeholder="Search...">
                <i class="magnify">🔍</i>
            </div>
            <nav>
                <div class="navbar">
                    <ul>
                        <li><a href="shop.html">Shop</a></li>
                        <li><a href="about.html">About</a></li>
                    </ul>
                </div>
            </nav>
        </div>
        <div class="checkUp">
            <div id="checkoutSummary" class="summary"></div>
            <form id="form" class="form">
                <div class="input2">
                    <input type="text" name="" id="name" placeholder="Type Your Full Name" class="inp" required>
                </div>
                <textarea name="" id="address" style="font-style: italic;" rows="5" placeholder="Place ur Address..." required></textarea>
                <div class="optional">
                    <select name="" id="select">
                        <option>Choose Payment Method</option>
                        <option>Pay on Delivery</option>
                        <option>Transfer</option>
                    </select>
                </div>
                <button type="submit" id="confirmOrder" class="Btn">Confirm Order</button>
                
            </form>
            <div id="successReceipt" class="Receipt">
                <h2>Order Confirmed! ✅</h2>
                <p id="receiptName"></p>
                <p id="receiptAddress"></p>
                <h3 id="receiptTotal"></h3>
                <p> Redirecting to home in 4s...</p>
            </div>
        </div>
    </div>
<script src="cart.js"></script>
<script src="check.js"></script>
</body>
</html>
